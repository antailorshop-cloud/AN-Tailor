<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1f5f9">
<title>Pay with UPI</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9;
    color: #0f172a; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 10px 30px rgba(15,23,42,.12); text-align: center; }
  .brand { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #64748b; }
  .amount { font-size: 34px; font-weight: 700; margin: 12px 0 4px; }
  .to { color: #475569; font-size: 15px; }
  .id { display: block; margin-top: 6px; font-size: 14px; color: #0f172a; word-break: break-all; }
  .pay { display: block; margin: 0; padding: 0; color: inherit; text-decoration: none; }
  .paybtn { display: block; margin: 22px 0 0; padding: 15px 18px; border-radius: 12px; background: #16a34a;
    color: #fff; font-size: 17px; font-weight: 600; }
  .pay:active .paybtn { background: #15803d; }
  .copybtn { display: block; width: 100%; margin: 10px 0 0; padding: 13px 18px; border: 1px solid #cbd5e1;
    border-radius: 12px; background: #f8fafc; color: #0f172a; font-size: 15px; font-weight: 600; cursor: pointer; }
  .copybtn:active { background: #eef2f7; }
  .id { user-select: all; }
  .hint { margin-top: 16px; font-size: 13px; color: #64748b; line-height: 1.5; }
  .err { color: #b91c1c; font-size: 16px; }
  .note { margin-top: 10px; font-size: 13px; color: #475569; }
</style>
</head>
<body>
<main class="card" id="card"></main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var vpa = (params.get('pa') || '').trim();
  var payee = (params.get('pn') || '').trim();
  var amount = Math.round((parseFloat(params.get('am')) || 0) * 100) / 100;
  var note = (params.get('tn') || '').trim();

  var VPA = /^[A-Za-z0-9][A-Za-z0-9._-]{1,63}@[A-Za-z][A-Za-z0-9._-]{1,63}$/;
  var card = document.getElementById('card');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rupees(n) {
    var parts = n.toFixed(2).split('.');
    var whole = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return '\u20b9' + whole + '.' + parts[1];
  }

  if (!VPA.test(vpa) || amount <= 0) {
    card.innerHTML = '<div class="err">This payment link is not valid.</div>' +
      '<div class="hint">Please ask the shop to send it again.</div>';
    return;
  }

  // Keep the '@' in the id literal: some UPI apps choke on a percent-encoded
  // id (name%40bank) and refuse the payee. Only the free-text parts are encoded.
  var query = 'pa=' + vpa +
    '&pn=' + encodeURIComponent(payee || 'Merchant') +
    '&cu=INR&am=' + encodeURIComponent(amount.toFixed(2));
  if (note) query += '&tn=' + encodeURIComponent(note);
  var intent = 'upi://pay?' + query;

  // The card leads with the amount and the id, then the pay button, then a
  // fallback for the apps that refuse a pay link: Paytm, and some bank apps,
  // will not open a upi:// intent for a personal id. Every one of them does
  // accept the id typed or pasted into its own "Pay to UPI ID" box, so the id
  // is offered to copy. The printed bill carries the QR for the in-shop case.
  card.innerHTML =
    '<div class="brand">' + esc(payee || 'UPI Payment') + '</div>' +
    '<div class="amount">' + esc(rupees(amount)) + '</div>' +
    '<div class="to">to<span class="id">' + esc(vpa) + '</span></div>' +
    (note ? '<div class="note">' + esc(note) + '</div>' : '') +
    '<a class="pay" id="pay" href="' + esc(intent) + '">' +
      '<span class="paybtn">Pay ' + esc(rupees(amount)) + '</span>' +
    '</a>' +
    '<button type="button" class="copybtn" id="copyId">Copy UPI ID</button>' +
    '<div class="hint">If your app does not open, tap <b>Copy UPI ID</b>, open your UPI app, ' +
    'choose <span nowrap>&ldquo;Pay to UPI ID&rdquo;</span>, paste and pay ' + esc(rupees(amount)) + '.</div>' +
    '<div class="hint">In the shop? Scan the QR printed on your bill with any UPI app.</div>';

  // Copying the id is the one route every UPI app supports. It is copied on its
  // own so it pastes cleanly into a "Pay to UPI ID" box.
  var copy = document.getElementById('copyId');
  if (copy) {
    copy.addEventListener('click', function () {
      var done = function () { copy.textContent = 'Copied'; };
      var fallback = function () {
        try {
          var ta = document.createElement('textarea');
          ta.value = vpa;
          ta.setAttribute('readonly', '');
          ta.style.position = 'absolute';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done();
        } catch (e) {}
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(vpa).then(done, fallback);
      } else {
        fallback();
      }
    });
  }

  // Best effort: open the UPI app straight away. A browser that refuses without a
  // tap simply does nothing here, and the card above is still there to tap. Only
  // when this page is the top window, so an embedded preview is left alone.
  if (window.top === window.self) {
    try {
      window.setTimeout(function () { window.location.href = intent; }, 900);
    } catch (e) {}
  }
})();
</script>
</body>
</html>
