<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1f5f9">
<title>Pay with UPI</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9;
    color: #0f172a; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 10px 30px rgba(15,23,42,.12); text-align: center; }
  .brand { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #64748b; }
  .amount { font-size: 34px; font-weight: 700; margin: 12px 0 4px; }
  .to { color: #475569; font-size: 15px; }
  .id { display: block; margin-top: 8px; font-size: 19px; font-weight: 600; color: #0f172a;
    word-break: break-all; user-select: all; background: #f8fafc; border: 1px solid #e2e8f0;
    border-radius: 10px; padding: 10px 12px; }
  .copybtn { display: block; width: 100%; margin: 14px 0 0; padding: 15px 18px; border: 0;
    border-radius: 12px; background: #16a34a; color: #fff; font-size: 17px; font-weight: 600;
    cursor: pointer; font-family: inherit; }
  .copybtn:active { background: #15803d; }
  .copybtn.done { background: #0f766e; }
  .steps { margin: 18px 0 0; padding: 0 0 0 0; list-style: none; text-align: left; }
  .steps li { position: relative; padding: 0 0 12px 34px; font-size: 14px; line-height: 1.5;
    color: #334155; }
  .steps .n { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%;
    background: #e2e8f0; color: #0f172a; font-size: 12px; font-weight: 700; line-height: 22px;
    text-align: center; }
  .hint { margin-top: 16px; font-size: 13px; color: #64748b; line-height: 1.5; }
  .note { margin-top: 10px; font-size: 13px; color: #475569; }
  .err { color: #b91c1c; font-size: 16px; }
  .rule { border: 0; border-top: 1px solid #e2e8f0; margin: 18px 0 14px; }
</style>
</head>
<body>
<main class="card" id="card"></main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var vpa = (params.get('pa') || '').trim();
  var payee = (params.get('pn') || '').trim();
  var amount = Math.round((parseFloat(params.get('am')) || 0) * 100) / 100;
  var note = (params.get('tn') || '').trim();

  var VPA = /^[A-Za-z0-9][A-Za-z0-9._-]{1,63}@[A-Za-z][A-Za-z0-9._-]{1,63}$/;
  var card = document.getElementById('card');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rupees(n) {
    var parts = n.toFixed(2).split('.');
    var whole = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return '\u20b9' + whole + '.' + parts[1];
  }

  if (!VPA.test(vpa) || amount <= 0) {
    card.innerHTML = '<div class="err">This payment link is not valid.</div>' +
      '<div class="hint">Please ask the shop to send it again.</div>';
    return;
  }

  // Why there is no "Pay" button that opens a UPI app
  // -------------------------------------------------
  // A upi:// link built by a website is rejected by Google Pay, PhonePe and
  // Paytm at the PIN step with "your money has not been debited". The payee
  // opens correctly, so the id is not the problem: since 2026 the apps only
  // accept an intent that carries a merchant code, a unique reference and a
  // signature from a licensed gateway. A hand-built link has none of those.
  //
  // Scanning a QR and typing the id by hand are untouched by that rule, so the
  // page gives the customer the id to paste. It is the only route that works
  // for every app without a gateway, and it costs the shop nothing.
  card.innerHTML =
    '<div class="brand">' + esc(payee || 'UPI Payment') + '</div>' +
    '<div class="amount">' + esc(rupees(amount)) + '</div>' +
    '<div class="to">to</div>' +
    '<span class="id" id="upiId">' + esc(vpa) + '</span>' +
    (note ? '<div class="note">' + esc(note) + '</div>' : '') +
    '<button type="button" class="copybtn" id="copyId">Copy UPI ID</button>' +
    '<hr class="rule">' +
    '<ol class="steps">' +
      '<li><span class="n">1</span>Open <b>GPay / PhonePe / Paytm</b>.</li>' +
      '<li><span class="n">2</span>Tap <b>&ldquo;Pay to UPI ID&rdquo;</b> (or the search box).</li>' +
      '<li><span class="n">3</span>Paste the copied id, enter <b>' + esc(rupees(amount)) + '</b> and pay.</li>' +
    '</ol>' +
    '<div class="hint">In the shop? Scan the QR printed on your bill with any UPI app.</div>';

  // Copying the id is the whole page, so it is done on its own: a pasted id has
  // to land cleanly in a "Pay to UPI ID" box with no spaces or stray text.
  var copy = document.getElementById('copyId');

  function sayCopied() {
    if (!copy) return;
    copy.textContent = 'Copied \u2013 now paste it in your UPI app';
    copy.className = 'copybtn done';
  }

  function fallbackCopy() {
    try {
      var ta = document.createElement('textarea');
      ta.value = vpa;
      ta.setAttribute('readonly', '');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      sayCopied();
    } catch (e) {}
  }

  if (copy) {
    copy.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(vpa).then(sayCopied, fallbackCopy);
      } else {
        fallbackCopy();
      }
    });
  }
})();
</script>
</body>
</html>
