name: PDF archive reminder

# Runs on the first of every month at 03:30 UTC = 09:00 IST. Whether an email
# is actually sent is decided by archive_reminder_months and
# archive_reminder_last_sent_at in shop_settings, both editable in the app.
on:
  schedule:
    - cron: '30 3 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send even if the saved interval has not elapsed'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: an-tailor-archive-reminder
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Send the archive reminder when due
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://taidyazxtcouyihxfxfe.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://antailorshop-cloud.github.io/AN-Tailor/' }}
          FORCE_REMINDER: ${{ inputs.force }}
        run: |
          set -euo pipefail

          missing=0
          if [ -z "${GMAIL_USER:-}" ]; then
            echo "::error::GMAIL_USER secret is required."
            missing=1
          fi
          if [ -z "${GMAIL_APP_PASSWORD:-}" ]; then
            echo "::error::GMAIL_APP_PASSWORD secret is required."
            missing=1
          fi
          if [ -z "${REMINDER_TO:-}" ]; then
            echo "::error::REMINDER_TO secret is required."
            missing=1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is required."
            missing=1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to read the saved interval."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          api="${SUPABASE_URL%/}/rest/v1/shop_settings"
          settings_json="$(curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${api}?select=key,value")"

          months="$(printf '%s' "$settings_json" \
            | jq -r '.[] | select(.key == "archive_reminder_months") | .value // empty' \
            | tail -n 1)"
          last="$(printf '%s' "$settings_json" \
            | jq -r '.[] | select(.key == "archive_reminder_last_sent_at") | .value // empty' \
            | tail -n 1)"

          case "$months" in
            3|6|12|18) ;;
            *) months=3 ;;
          esac

          case "$months" in
            3) interval_label="3 months" ;;
            6) interval_label="6 months" ;;
            12) interval_label="1 year" ;;
            18) interval_label="1.5 years" ;;
          esac

          now_epoch="$(date -u +%s)"
          if [ "${FORCE_REMINDER:-false}" = "true" ]; then
            due=1
            echo "Manual force-send requested."
          elif [ -z "$last" ]; then
            due=1
          else
            due_epoch="$(date -u -d "$last + ${months} months" +%s)"
            if [ "$now_epoch" -ge "$due_epoch" ]; then due=1; else due=0; fi
          fi

          if [ "$due" -eq 0 ]; then
            echo "Archive reminder is not due yet. Interval: ${interval_label}."
            exit 0
          fi

          base="${SITE_URL:-https://antailorshop-cloud.github.io/AN-Tailor/}"
          backup_url="${base%/}/#/settings/backup"
          clear_url="${base%/}/#/settings/clear-pdfs"
          mail="$RUNNER_TEMP/archive-reminder.eml"

          # CRLF is used throughout so Gmail treats this as a normal text email.
          line() { printf '%s\r\n' "$1" >> "$mail"; }
          : > "$mail"

          line "From: ${GMAIL_USER}"
          line "To: ${REMINDER_TO}"
          line "Subject: AN TAILOR - ${interval_label} PDF archive reminder"
          line "MIME-Version: 1.0"
          line "Content-Type: text/plain; charset=UTF-8"
          line "Content-Transfer-Encoding: 7bit"
          line ""
          line "Hello,"
          line ""
          line "Your saved archive interval is ${interval_label}. It is time to"
          line "download the AN TAILOR backups and archive them in Google Drive."
          line ""
          line "1. Open Backup and download both zips (CSV backup and PDF archive):"
          line "   ${backup_url}"
          line ""
          line "2. Upload both zips to Google Drive."
          line ""
          line "3. Only after both zips are safe in Drive, open Clear stored PDFs:"
          line "   ${clear_url}"
          line ""
          line "The clear panel needs the archive tick, the word CLEAR, your password"
          line "and a final confirmation. This email only opens the app. It does not"
          line "delete anything by itself."
          line ""
          line "Bill records, payments and saved snapshots are kept when PDFs are"
          line "cleared, so a later bill message can rebuild the file."
          line ""
          line "AN TAILOR"

          curl --silent --show-error --fail \
            --ssl-reqd \
            --url "smtp://smtp.gmail.com:587" \
            --user "${GMAIL_USER}:${GMAIL_APP_PASSWORD}" \
            --mail-from "${GMAIL_USER}" \
            --mail-rcpt "${REMINDER_TO}" \
            --upload-file "$mail"

          # Restart the interval after a successful send. The app writes the same
          # key when the Owner saves a new choice, so changing the setting also
          # starts the clock from that day.
          now_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          patch_body="$(printf '{"value":"%s"}' "$now_iso")"
          code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -X PATCH \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$patch_body" \
            "${api}?key=eq.archive_reminder_last_sent_at")"

          if [ "$code" = "404" ]; then
            insert_body="$(printf '{"key":"archive_reminder_last_sent_at","value":"%s"}' "$now_iso")"
            code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
              -X POST \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              --data "$insert_body" \
              "$api")"
          fi

          if [ "$code" -ge 400 ] 2>/dev/null; then
            echo "::warning::Reminder sent, but the last-sent stamp could not be saved (HTTP ${code})."
          else
            echo "Archive reminder sent to ${REMINDER_TO}; next due in ${interval_label}."
          fi
