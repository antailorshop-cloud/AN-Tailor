<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AN TAILOR - Price Poster</title>
<style>
  /* AN TAILOR - printable price poster.
   *
   * Designed as a rate card for the shop wall, in the style of the reference
   * poster the shop sent: blush paper, gold frame, banner headings per service,
   * a photo in every section, prices in plum pills, and a WhatsApp band at the
   * foot.
   *
   * Every tailoring rate is printed as a STARTING price. That is deliberate:
   * a fixed figure on a wall is a promise, and handwork cannot be promised
   * before the design is seen. The small print says so in words as well.
   *
   * The sheet is laid out in millimetres at A3 and the screen preview is that
   * same page scaled down, so what is approved on screen is what prints.
   */
  :root {
    --plum: #4a1036;
    --plum-2: #6b1a4c;
    --gold: #b08a2e;
    --gold-2: #d9b968;
    --gold-3: #efe0b8;
    --blush: #fdeef1;
    --cream: #fffaf5;
    --rose: #b0466e;
    --ink: #3b2233;
    --muted: #7c5a70;
    --line: #e6dce3;
    --pw: 297mm;
    --ph: 420mm;
    --fs: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e9e3e7; color: var(--ink);
  }

  /* ---------------- editor (never printed) ---------------- */
  .app { display: flex; gap: 20px; padding: 20px; align-items: flex-start; }
  .editor {
    width: 380px; flex: 0 0 380px; background: #fff; border-radius: 14px;
    padding: 18px; box-shadow: 0 8px 24px rgba(74, 16, 54, .12);
    max-height: calc(100vh - 40px); overflow: auto;
  }
  .editor h1 { font-size: 17px; margin: 0 0 4px; color: var(--plum); }
  .editor .lead { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .field { margin-bottom: 9px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 9px 10px; border: 1px solid #d7dbe0;
    border-radius: 8px; font: inherit; font-size: 14px; }
  .field input:focus { outline: 2px solid #c9a7bb; border-color: #c9a7bb; }

  .sec { border: 1px solid var(--line); border-radius: 10px; margin: 11px 0; overflow: hidden; }
  .sec-head { display: flex; gap: 6px; align-items: center; background: #fbf5f8; padding: 8px; }
  .sec-head input { flex: 1; padding: 7px 8px; border: 1px solid #e2d6de; border-radius: 6px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--plum); }
  .row { display: flex; gap: 6px; align-items: center; padding: 6px 8px;
    border-top: 1px solid var(--line); }
  .row input.n { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #e2d6de;
    border-radius: 6px; font: inherit; font-size: 13px; }
  .row input.p { width: 76px; padding: 6px 8px; border: 1px solid #e2d6de;
    border-radius: 6px; font: inherit; font-size: 13px; text-align: right; }
  .x { border: 0; background: none; color: #b91c1c; font-size: 17px; line-height: 1;
    cursor: pointer; padding: 2px 4px; }
  .add { width: 100%; margin-top: 6px; padding: 8px; border: 1px dashed #d3c4cd;
    border-radius: 8px; background: none; color: var(--plum); font: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer; }
  .add:hover { background: #fbf5f8; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
    border-top: 1px solid var(--line); padding-top: 14px; }
  .btn { padding: 10px 14px; border-radius: 9px; border: 1px solid transparent;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--plum); color: #fff; }
  .btn.secondary { background: #fff; border-color: #d8c7d1; color: var(--plum); }
  .btn.quiet { background: none; color: var(--muted); }
  .msg { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; min-height: 1em; }
  .msg.bad { color: #b91c1c; }
  .hint { font-size: 11.5px; color: var(--muted); line-height: 1.55; margin: 10px 0 0; }
  .hint b { color: var(--plum); }

  /* ---------------- the sheet ---------------- */
  .stage { flex: 1; min-width: 0; display: flex; justify-content: center; }
  .paper {
    width: var(--pw); height: calc(var(--ph) - 0.5mm);
    position: relative; overflow: hidden; transform-origin: top left;
    display: flex; flex-direction: column;
    padding: calc(11mm * var(--fs)) calc(11mm * var(--fs)) calc(9mm * var(--fs));
    color: var(--ink);
    background:
      radial-gradient(rgba(176, 138, 46, .16) .35mm, transparent .35mm) 0 0 / 5mm 5mm,
      radial-gradient(120% 75% at 50% 0%, #fffdfb 0%, var(--blush) 45%, #fbe3ea 100%);
    box-shadow: 0 10px 30px rgba(74, 16, 54, .20);
  }

  /* gold double frame with a flourish in each corner */
  .frame { position: absolute; inset: calc(5mm * var(--fs)); pointer-events: none; }
  .frame::before, .frame::after { content: ''; position: absolute; }
  .frame::before { inset: 0; border: .7mm solid var(--gold-2); border-radius: 2mm; }
  .frame::after { inset: 1.6mm; border: .25mm solid var(--gold); border-radius: 1.5mm; }
  .corner { position: absolute; width: calc(26mm * var(--fs)); height: calc(26mm * var(--fs));
    color: var(--gold); opacity: .55; }
  .corner.tl { top: calc(2.5mm * var(--fs)); left: calc(2.5mm * var(--fs)); }
  .corner.tr { top: calc(2.5mm * var(--fs)); right: calc(2.5mm * var(--fs)); transform: scaleX(-1); }
  .corner.bl { bottom: calc(2.5mm * var(--fs)); left: calc(2.5mm * var(--fs)); transform: scaleY(-1); }
  .corner.br { bottom: calc(2.5mm * var(--fs)); right: calc(2.5mm * var(--fs)); transform: scale(-1, -1); }

  /* ---------------- header ---------------- */
  .head { text-align: center; flex: none; padding-top: calc(1mm * var(--fs)); }
  .sew { display: block; width: calc(34mm * var(--fs)); height: calc(21mm * var(--fs));
    margin: 0 auto calc(1mm * var(--fs)); color: var(--gold); }
  .shop { font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: calc(56pt * var(--fs)); line-height: .98; color: var(--plum);
    letter-spacing: .015em; }
  .sub { font-size: calc(13pt * var(--fs)); color: var(--plum-2);
    letter-spacing: .1em; margin-top: calc(1.5mm * var(--fs)); }
  .flourish { display: block; width: calc(150mm * var(--fs)); height: calc(7mm * var(--fs));
    margin: calc(1.5mm * var(--fs)) auto 0; color: var(--gold); }
  .banner { display: inline-flex; align-items: center; gap: calc(3mm * var(--fs));
    margin-top: calc(1mm * var(--fs)); padding: calc(2mm * var(--fs)) calc(9mm * var(--fs));
    border-radius: 99mm; border: .5mm solid var(--gold-2);
    background: linear-gradient(#6b1a4c, #4a1036);
    color: #fff; font-size: calc(12.5pt * var(--fs)); letter-spacing: .12em;
    text-transform: uppercase; font-weight: 600;
    box-shadow: 0 1mm 0 rgba(74, 16, 54, .18); }
  .banner .h { color: var(--gold-2); font-size: .85em; }

  /* ---------------- service cards ---------------- */
  .board { flex: 1 1 auto; display: flex; flex-direction: column;
    gap: calc(3.4mm * var(--fs)); margin-top: calc(6mm * var(--fs)); min-height: 0; }

  .card { position: relative; flex: 1 1 0; min-height: calc(50mm * var(--fs));
    display: flex; align-items: center; gap: calc(6mm * var(--fs));
    padding: calc(7.5mm * var(--fs)) calc(6mm * var(--fs)) calc(3mm * var(--fs));
    border-radius: calc(5mm * var(--fs));
    border: .45mm solid rgba(176, 138, 46, .55);
    background: rgba(255, 253, 250, .8);
    box-shadow: 0 1mm 2.4mm rgba(74, 16, 54, .07);
  }
  .card.rev { flex-direction: row-reverse; }

  .card .pill { position: absolute; top: calc(-5.6mm * var(--fs)); left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    display: flex; align-items: center; gap: calc(2.6mm * var(--fs));
    padding: calc(1.8mm * var(--fs)) calc(8mm * var(--fs));
    border-radius: 99mm; border: .5mm solid var(--gold-2);
    background: linear-gradient(#6b1a4c, #4a1036); color: #fff;
    font-size: calc(13pt * var(--fs)); font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; box-shadow: 0 1.2mm 0 rgba(74, 16, 54, .16); }
  .card .pill .h { color: var(--gold-2); font-size: .8em; }

  .card .ph { flex: none; width: calc(40mm * var(--fs)); height: calc(40mm * var(--fs));
    border-radius: 50%; padding: calc(1.1mm * var(--fs));
    background: #fff; border: .5mm solid var(--gold-2);
    box-shadow: 0 0 0 .25mm var(--gold), 0 1mm 2mm rgba(74, 16, 54, .12); }
  .card .ph img { width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; display: block; filter: url(#duotone); }
  .card .ph.icon { display: flex; align-items: center; justify-content: center;
    background: radial-gradient(#fffdf8, #f7e9d2); }
  .card .ph.icon svg { width: 62%; height: 62%; color: var(--plum-2); }

  .card .body { flex: 1 1 auto; min-width: 0; height: 100%;
    display: flex; flex-direction: column; justify-content: space-evenly; }
  .line { display: flex; align-items: baseline; gap: calc(2mm * var(--fs));
    padding: calc(.7mm * var(--fs)) 0; }
  .line .h { color: var(--rose); font-size: calc(9pt * var(--fs)); flex: none; }
  .line .n { font-size: calc(12pt * var(--fs)); color: var(--ink); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .line .dots { flex: 1 1 auto; border-bottom: .22mm dotted #cbb4c1;
    transform: translateY(-.8mm); }
  .line .start { flex: none; font-family: Georgia, serif; font-style: italic;
    font-size: calc(9.5pt * var(--fs)); color: var(--gold); }
  .line .p { flex: none; min-width: calc(19mm * var(--fs)); text-align: center;
    padding: calc(.5mm * var(--fs)) calc(2.4mm * var(--fs));
    border-radius: calc(2mm * var(--fs)); background: var(--plum); color: #fff;
    font-size: calc(11pt * var(--fs)); font-weight: 700; letter-spacing: .02em; }

  .empty-note { color: var(--muted); font-size: calc(11pt * var(--fs));
    text-align: center; padding: calc(12mm * var(--fs)) 0; }

  /* ---------------- footer ---------------- */
  .foot { flex: none; margin-top: calc(3.4mm * var(--fs));
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: calc(5mm * var(--fs));
    padding: calc(3.4mm * var(--fs)) calc(6mm * var(--fs));
    border-radius: calc(4mm * var(--fs)); border: .45mm solid var(--gold-2);
    background: linear-gradient(100deg, #4a1036, #6b1a4c 52%, #4a1036);
    color: #fff; }
  .foot .tag { font-family: Georgia, serif; font-style: italic;
    font-size: calc(10pt * var(--fs)); line-height: 1.35; color: var(--gold-3); }
  .foot .call { text-align: center; }
  .foot .ask { font-size: calc(8pt * var(--fs)); letter-spacing: .2em;
    text-transform: uppercase; color: var(--gold-2); font-weight: 700; }
  .foot .num { display: flex; align-items: center; justify-content: center;
    gap: calc(2.5mm * var(--fs)); margin-top: calc(.8mm * var(--fs));
    font-size: calc(24pt * var(--fs)); font-weight: 700; letter-spacing: .02em; }
  .foot .num svg { width: calc(9mm * var(--fs)); height: calc(9mm * var(--fs)); flex: none; }
  .foot .badges { display: flex; justify-content: flex-end; gap: calc(4mm * var(--fs)); }
  .foot .badge { text-align: center; font-size: calc(7pt * var(--fs));
    line-height: 1.25; color: var(--gold-3); letter-spacing: .03em; }
  .foot .badge svg { display: block; width: calc(7mm * var(--fs)); height: calc(7mm * var(--fs));
    margin: 0 auto calc(.6mm * var(--fs)); color: var(--gold-2); }

  .note { flex: none; margin-top: calc(1.8mm * var(--fs)); text-align: center;
    font-size: calc(7.6pt * var(--fs)); color: var(--muted); letter-spacing: .02em; }

  @media (max-width: 980px) {
    .app { flex-direction: column; padding: 10px; }
    .editor { width: 100%; flex: none; max-height: none; }
    .stage { width: 100%; }
  }

  /* ---------------- print ---------------- */
  @page { size: A3 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .editor, .noprint { display: none !important; }
    .app { display: block; padding: 0; }
    .stage { display: block; width: auto; height: auto; }
    .paper { transform: none !important; box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>

<!-- A proper two-colour duotone, so five photos shot on five different walls
     all sit in the same blush-and-plum palette as the rest of the sheet. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="duotone" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="
      0.1318 0.4434 0.0448 0 0.360
      0.1595 0.5364 0.0542 0 0.100
      0.1361 0.4577 0.0462 0 0.260
      0      0      0      1 0" />
  </filter>
</svg>

<div class="app">
  <aside class="editor noprint">
    <h1>Price poster</h1>
    <p class="lead">Type the rates on the left and the A3 sheet on the right updates.
      Every tailoring rate prints as a <b>starting</b> price.</p>

    <div class="field"><label for="fShop">Shop name</label>
      <input id="fShop" data-top="shop"></div>
    <div class="field"><label for="fSub">Second line</label>
      <input id="fSub" data-top="sub"></div>
    <div class="field"><label for="fBanner">Banner line</label>
      <input id="fBanner" data-top="banner"></div>
    <div class="field"><label for="fPhone">WhatsApp number</label>
      <input id="fPhone" data-top="phone"></div>
    <div class="field"><label for="fNote">Small print</label>
      <input id="fNote" data-top="note"></div>

    <div id="sections"></div>
    <button class="add" id="addSec">+ Add a section</button>

    <div class="tools">
      <button class="btn primary" id="printBtn">Print / Save PDF</button>
      <button class="btn secondary" id="loadBtn">Fill from my price list</button>
      <button class="btn quiet" id="resetBtn">Start over</button>
    </div>
    <p class="msg" id="msg"></p>
    <p class="hint"><b>A3 print:</b> 200&ndash;300 gsm paper, <b>Margins: None</b>,
      tick <b>Background graphics</b>. Laminate it and stick it at the counter.</p>
  </aside>

  <div class="stage" id="stage">
    <article class="paper" id="paper"></article>
  </div>
</div>

<script src="config.local.js"></script>
<script src="scripts/config.js"></script>
<script src="scripts/supabase.js"></script>
<script>
(function () {
  var KEY = 'anTailorPoster';

  /* A blank price is not zero: an item with no figure is left off the sheet
   * rather than printed as "Starting Rs 0", which would be an offer the shop
   * has to honour. The editor keeps the row so the number can be filled in. */
  var DEFAULTS = {
    shop: 'AN TAILOR',
    sub: 'Anandha Nayagi Tailor \u00b7 Ladies & Gents',
    banner: 'Tailoring & Stitching Services',
    phone: '94449 80887',
    note: 'All prices are starting rates. The final price depends on design, lining, handwork and fabric. Confirm on WhatsApp before booking.',
    sections: [
      { title: 'Basic stitches', starting: false, art: 'icon', rows: [
        { name: 'Saree hemming', price: '' },
        { name: 'Kurti & pant alteration', price: '' },
        { name: 'Nighty side alteration', price: '' },
        { name: 'Nighty side, sleeve & height', price: '' },
        { name: 'Readymade dress sleeve', price: '' }
      ] },
      { title: 'Blouse', starting: true, art: 'blouse', rows: [
        { name: 'Normal blouse', price: '' },
        { name: 'Lining blouse', price: '' },
        { name: 'Princess cut blouse', price: '' },
        { name: 'Boat neck blouse', price: '' },
        { name: 'Aari blouse', price: '' },
        { name: 'Design / pattern blouse', price: '' }
      ] },
      { title: 'Saree pre-pleating', starting: true, art: 'saree', rows: [
        { name: 'Single saree', price: '' },
        { name: 'Double saree', price: '' }
      ] },
      { title: 'Dresses', starting: true, art: 'dress', rows: [
        { name: 'Kids frock', price: '' },
        { name: 'Pavadai sattai', price: '' },
        { name: 'Saree to maxi', price: '' }
      ] }
    ]
  };

  var ARTS = {
    blouse: 'assets/poster/blouse.jpg',
    saree: 'assets/poster/saree.jpg',
    dress: 'assets/poster/dress.jpg'
  };

  // Whether this browser already had a poster, kept before load() runs: a
  // first visit may fill itself from the price list, a saved poster never is
  // overwritten by it.
  var hadSaved = false;
  var state = load();
  var paper = document.getElementById('paper');
  var stage = document.getElementById('stage');
  var sectionsEl = document.getElementById('sections');
  var msg = document.getElementById('msg');

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && Array.isArray(saved.sections) && saved.sections.length) {
        hadSaved = true;
        saved.sections.forEach(function (s) {
          if (typeof s.starting !== 'boolean') s.starting = true;
        });
        return saved;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULTS));
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      say('This browser is out of storage, so the last change was not kept.', true);
      return false;
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Indian digit grouping, so 12500 reads 12,500 and not 12.500.
  function rupees(n) {
    var whole = String(Math.round(n));
    if (whole.length > 3) {
      var last3 = whole.slice(-3);
      var rest = whole.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      whole = rest + ',' + last3;
    }
    return '\u20b9' + whole;
  }

  /* ---------------- drawings ---------------- */

  var SVG = {
    machine:
      '<svg class="sew" viewBox="0 0 160 100" fill="none" stroke="currentColor" ' +
      'stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="8" y="80" width="144" height="10" rx="4"/>' +
        '<path d="M130 80V34c0-8 6-13 14-13h6"/>' +
        '<path d="M150 21H52c-12 0-20 8-20 20v11"/>' +
        '<rect x="30" y="52" width="26" height="16" rx="3"/>' +
        '<path d="M43 68v12"/><path d="M35 80h16"/>' +
        '<circle cx="137" cy="58" r="13"/><circle cx="137" cy="58" r="3.5"/>' +
        '<rect x="92" y="8" width="13" height="9" rx="2"/>' +
        '<path d="M92 13c-10 4-20 12-27 21"/>' +
        '<path d="M56 86h66" stroke-dasharray="2 7"/>' +
      '</svg>',
    flourish:
      '<svg class="flourish" viewBox="0 0 300 14" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round">' +
        '<path d="M4 7h86"/><path d="M210 7h86"/>' +
        '<path d="M104 7c6-6 14-6 20 0"/><path d="M176 7c6 6 14 6 20 0"/>' +
        '<path d="M150 1.5l6 5.5-6 5.5-6-5.5z"/>' +
        '<circle cx="126" cy="7" r="1.8"/><circle cx="174" cy="7" r="1.8"/>' +
      '</svg>',
    corner:
      '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round">' +
        '<path d="M2 42C2 20 20 2 42 2"/>' +
        '<path d="M8 58C8 30 30 8 58 8" opacity=".6"/>' +
        '<path d="M12 20c10 2 16 8 18 18-10-2-16-8-18-18z" fill="currentColor" stroke="none" opacity=".55"/>' +
        '<path d="M20 12c2 10 8 16 18 18-2-10-8-16-18-18z" fill="currentColor" stroke="none" opacity=".35"/>' +
        '<circle cx="42" cy="42" r="2.4" fill="currentColor" stroke="none"/>' +
      '</svg>',
    scissors:
      '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="26" cy="76" r="11"/><circle cx="26" cy="24" r="11"/>' +
        '<path d="M35 69l51 20"/><path d="M35 31L86 11"/>' +
        '<path d="M35 31l34 38"/><path d="M86 11L63 47"/>' +
      '</svg>',
    whatsapp:
      '<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">' +
        '<path d="M24 4C13 4 4 13 4 24c0 3.5.9 6.8 2.6 9.8L4 44l10.5-2.7c2.9 1.6 6.2 2.5 9.5 2.5 11 0 20-9 20-20S35 4 24 4zm0 36c-3 0-5.9-.8-8.4-2.3l-.6-.4-6.2 1.6 1.7-6-.4-.6A16 16 0 018 24c0-8.8 7.2-16 16-16s16 7.2 16 16-7.2 16-16 16z"/>' +
        '<path d="M34 28.5c-.5-.3-3.2-1.6-3.7-1.8-.5-.2-.9-.3-1.2.2-.4.5-1.4 1.8-1.7 2.1-.3.4-.6.4-1.1.1-.5-.3-2.2-.8-4.2-2.6-1.6-1.4-2.6-3.1-2.9-3.6-.3-.5 0-.8.2-1.1.2-.2.5-.6.7-.9.2-.3.3-.5.5-.9.2-.4.1-.7 0-1-.1-.3-1.2-2.9-1.6-4-.4-1-.8-.9-1.1-.9h-.9c-.3 0-.8.1-1.2.6-.4.5-1.6 1.6-1.6 3.9s1.6 4.5 1.9 4.8c.2.3 3.2 4.9 7.8 6.8 1.1.5 1.9.8 2.6 1 1.1.3 2.1.3 2.9.2.9-.1 3.2-1.3 3.7-2.6.5-1.3.5-2.4.3-2.6-.1-.2-.5-.4-1-.7z"/>' +
      '</svg>',
    needle:
      '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M72 10L30 78"/><path d="M62 22l10 8"/>' +
        '<circle cx="72" cy="14" r="7"/>' +
        '<path d="M38 70c-14 4-22 12-24 22"/>' +
      '</svg>',
    gem:
      '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" ' +
      'stroke-linejoin="round">' +
        '<path d="M48 14h4l14 22-20 40L26 36z"/>' +
        '<path d="M26 36h48"/><path d="M40 36l10-22 10 22-10 40z"/>' +
      '</svg>',
    hanger:
      '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M50 30V24c0-6 5-10 11-10s11 4 11 10"/>' +
        '<path d="M50 30L14 62c-4 3-2 8 3 8h66c5 0 7-5 3-8z"/>' +
      '</svg>'
  };

  /* ---------------- the sheet ---------------- */

  function paint() {
    var cards = state.sections.map(function (sec, i) {
      var rows = (sec.rows || []).filter(function (r) {
        return String(r.name || '').trim() && Number(r.price) > 0;
      });
      if (!rows.length) return '';

      var art = sec.art || 'icon';
      var photo = ARTS[art]
        ? '<div class="ph"><img src="' + ARTS[art] + '" alt=""></div>'
        : '<div class="ph icon">' + SVG.scissors + '</div>';

      return '<section class="card' + (i % 2 ? ' rev' : '') + '"' +
          ' style="flex-grow:' + (rows.length + 2) + '">' +
        '<div class="pill"><span class="h">\u2665</span><span>' + esc(sec.title) +
          '</span><span class="h">\u2665</span></div>' +
        photo +
        '<div class="body">' +
          rows.map(function (r) {
            return '<div class="line">' +
              '<span class="h">\u2665</span>' +
              '<span class="n">' + esc(r.name) + '</span>' +
              '<span class="dots"></span>' +
              (sec.starting ? '<span class="start">Starting</span>' : '') +
              '<span class="p">' + rupees(Number(r.price)) + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</section>';
    }).join('');

    paper.innerHTML =
      '<div class="frame"></div>' +
      '<div class="corner tl">' + SVG.corner + '</div>' +
      '<div class="corner tr">' + SVG.corner + '</div>' +
      '<div class="corner bl">' + SVG.corner + '</div>' +
      '<div class="corner br">' + SVG.corner + '</div>' +
      '<header class="head">' +
        SVG.machine +
        '<div class="shop">' + esc(state.shop) + '</div>' +
        '<div class="sub">' + esc(state.sub) + '</div>' +
        SVG.flourish +
        '<div><span class="banner"><span class="h">\u2665</span>' +
          esc(state.banner) + '<span class="h">\u2665</span></span></div>' +
      '</header>' +
      '<div class="board">' + (cards ||
        '<p class="empty-note">Type a price in the editor and it appears here.</p>') + '</div>' +
      '<footer class="foot">' +
        '<div class="tag">Your dream outfit&hellip;<br>our stitching care</div>' +
        '<div class="call">' +
          '<div class="ask">For Enquiries &amp; Bookings</div>' +
          '<div class="num">' + SVG.whatsapp + '<span>' + esc(state.phone) + '</span></div>' +
        '</div>' +
        '<div class="badges">' +
          '<div class="badge">' + SVG.needle + 'Perfect<br>Fit</div>' +
          '<div class="badge">' + SVG.gem + 'High<br>Quality</div>' +
          '<div class="badge">' + SVG.hanger + 'Elegant<br>Finish</div>' +
        '</div>' +
      '</footer>' +
      '<div class="note">' + esc(state.note) + '</div>';

    autoFit();
  }

  /* The sheet is one page or it is not a poster. The type is reduced in small
   * steps until everything fits, so a long price list can never spill onto a
   * second sheet that the print shop would hand over as a blank page. */
  function autoFit() {
    var k = 1;
    setFs(k);
    var guard = 0;
    while (overflows() && guard < 22) {
      k = Math.max(0.58, k - 0.035);
      setFs(k);
      guard += 1;
    }
  }

  function overflows() {
    if (paper.scrollHeight > paper.clientHeight + 2) return true;
    return Array.prototype.some.call(paper.querySelectorAll('.card'), function (c) {
      return c.scrollHeight > c.clientHeight + 2;
    });
  }

  function setFs(k) {
    document.documentElement.style.setProperty('--fs', String(k));
  }

  // Preview scale. The paper is a real A3; the screen shows it at whatever fits.
  function fit() {
    var mm = 3.7795275591;
    var avail = stage.clientWidth || 600;
    var k = Math.min(avail / (297 * mm), 1);
    paper.style.transform = 'scale(' + k + ')';
    stage.style.height = (420 * mm * k) + 'px';
  }

  /* ---------------- editor ---------------- */

  function editor() {
    sectionsEl.innerHTML = state.sections.map(function (sec, si) {
      return '<div class="sec">' +
        '<div class="sec-head">' +
          '<input data-sec="' + si + '" value="' + esc(sec.title) + '" aria-label="Section name">' +
          '<button class="x" data-delsec="' + si + '" title="Remove section">&times;</button>' +
        '</div>' +
        (sec.rows || []).map(function (r, ri) {
          return '<div class="row">' +
            '<input class="n" data-s="' + si + '" data-r="' + ri + '" data-f="name" value="' + esc(r.name) + '" placeholder="Item">' +
            '<input class="p" data-s="' + si + '" data-r="' + ri + '" data-f="price" inputmode="numeric" value="' + esc(r.price) + '" placeholder="0">' +
            '<button class="x" data-delrow="' + si + ':' + ri + '" title="Remove item">&times;</button>' +
          '</div>';
        }).join('') +
        '<button class="add" data-addrow="' + si + '">+ Add item</button>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('[data-top]'), function (el) {
      el.value = state[el.getAttribute('data-top')] || '';
    });
  }

  sectionsEl.addEventListener('input', function (e) {
    var el = e.target;

    if (el.hasAttribute('data-sec')) {
      state.sections[+el.getAttribute('data-sec')].title = el.value;
      save(); paint(); return;
    }

    var si = el.getAttribute('data-s');
    var ri = el.getAttribute('data-r');
    if (si === null || ri === null) return;

    state.sections[+si].rows[+ri][el.getAttribute('data-f')] = el.value;
    save();
    paint();
  });

  sectionsEl.addEventListener('click', function (e) {
    var t = e.target;

    if (t.hasAttribute('data-addrow')) {
      var si = +t.getAttribute('data-addrow');
      state.sections[si].rows.push({ name: '', price: '' });
      save(); editor(); paint(); fit(); return;
    }

    if (t.hasAttribute('data-delrow')) {
      var parts = t.getAttribute('data-delrow').split(':');
      state.sections[+parts[0]].rows.splice(+parts[1], 1);
      save(); editor(); paint(); return;
    }

    if (t.hasAttribute('data-delsec')) {
      state.sections.splice(+t.getAttribute('data-delsec'), 1);
      save(); editor(); paint(); return;
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-top]'), function (el) {
    el.addEventListener('input', function () {
      state[el.getAttribute('data-top')] = el.value;
      save(); paint();
    });
  });

  document.getElementById('addSec').addEventListener('click', function () {
    state.sections.push({
      title: 'New section', starting: true, art: 'icon',
      rows: [{ name: '', price: '' }]
    });
    save(); editor(); paint(); fit();
  });

  /* ---------------- buttons ---------------- */

  document.getElementById('printBtn').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!window.confirm('Clear the poster and start again? Prices typed here are lost.')) return;
    state = JSON.parse(JSON.stringify(DEFAULTS));
    save(); editor(); paint(); fit();
    say('Cleared.');
  });

  /* ---------------- prices from the app ---------------- */

  function say(text, bad) {
    msg.textContent = text || '';
    msg.className = 'msg' + (bad ? ' bad' : '');
  }

  function words(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
  }

  // How alike a price row and a poster row are: the smaller word list has to be
  // contained in the larger one. "Blouse" alone scores 1 against "Normal
  // blouse", while "Blouse / Normal" scores 2, so the more exact option wins.
  // Only the best match is used, and a score of 1 is not enough on its own.
  function score(a, b) {
    var x = words(a), y = words(b);
    if (!x.length || !y.length) return 0;
    var small = x.length <= y.length ? x : y;
    var big = x.length <= y.length ? y : x;
    var hit = small.every(function (w) { return big.indexOf(w) > -1; });
    return hit ? small.length : 0;
  }

  function fillPrices(silent) {
    var sb = window.ANT && window.ANT.sb;
    if (!sb || !sb.configured()) {
      if (!silent) say('The app is not configured on this page.', true);
      return;
    }
    if (!sb.session()) {
      say('Type the rates on the left, or open this page from Settings inside the app ' +
        'and press "Fill from my price list".', !silent);
      return;
    }

    say('Reading your prices...');

    sb.from('prices')
      .select('group_name,item,option,price,status')
      .eq('status', 'ACTIVE')
      .order('item', true)
      .then(function (res) {
        if (res.error) return say(res.error.message, true);

        var rows = res.data || [];
        if (!rows.length) return say('No prices saved in the app yet.', true);

        var filled = 0, total = 0;

        state.sections.forEach(function (sec) {
          sec.rows.forEach(function (row) {
            total += 1;
            var best = 0, price = null;

            rows.forEach(function (r) {
              var p = Number(r.price) || 0;
              if (p <= 0) return;
              var option = String(r.option || '').trim();
              var key = String(r.item || '') +
                (option && option !== '-' ? ' ' + option : '');
              var s = Math.max(score(key, row.name), score(r.item || '', row.name));
              if (s > best) { best = s; price = p; }
            });

            if (best >= 2 && price !== null) {
              row.price = String(price);
              filled += 1;
            }
          });
        });

        save(); editor(); paint(); fit();
        say(filled
          ? 'Filled ' + filled + ' of ' + total + ' rows from your price list. ' +
            'Check each figure, then print.'
          : 'No row name matched a saved price. Type the rates by hand; ' +
            'they are kept in this browser.', !filled);
      });
  }

  document.getElementById('loadBtn').addEventListener('click', function () {
    fillPrices(false);
  });

  /* ---------------- start ---------------- */
  editor();
  paint();
  fit();
  window.addEventListener('resize', fit);

  // First visit, already signed in: fill the sheet from the shop's own price
  // list, so opening the poster from Settings shows a finished rate card rather
  // than sixteen empty boxes. A poster that has been edited is never touched.
  if (!hadSaved) fillPrices(true);
})();
</script>
</body>
</html>
